<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pubcrawler</title>
    <meta charset="utf-8" />
    <title>Mapbox Directions</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script defer src="bundle.js"></script>
  </head>
  <body>
    <div id="container" class="1xl:container">
      <div
        class="modal hidden absolute top-0 left-0 h-full w-full justify-center"
        id="no-results"
      >
        <div
          class="modal_content mx-auto mt-72 w-64 h-64 relative text-center shadow-lg border-2 border-white rounded-lg p-10 z-50 bg-slate-300"
        >
          <p id="no_pubs">
            No routes found within the specified distance. Please try adjusting
            the distance or number of pubs.
          </p>
          <button
            id="modal-exit"
            class="shadow bg-slate-50 hover:bg-slate-200 rounded-lg p-2 mt-6"
          >
            Close
          </button>
        </div>
      </div>
      <div class="min-h-[100dvh] flex flex-col">
        <header class="bg-slate-600 h-12 flex items-center">
          <img src="favicon.ico" alt="BarCrawler logo" class="h-8 w-8 m-2" />
          <h1 class="text-white text-lg font-bold">BarCrawler</h1>
        </header>

        <div
          class="bg-sky-600 h-15 flex items-center justify-between py-2 px-1 text-xs sm:text-lg"
        >
          <button
            id="dropdownCitiesButton"
            data-dropdown-toggle="dropdownCities"
            data-dropdown-placement="bottom"
            class="shadow bg-white p-2 m-1 font-medium rounded-lg px-5 py-2.5 text-center inline-flex items-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
            type="button"
          >
            Select a city
            <svg
              class="w-2.5 h-2.5 ms-3"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 10 6"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m1 1 4 4 4-4"
              />
            </svg>
          </button>

          <div
            id="dropdownCities"
            class="z-10 hidden bg-white rounded-lg shadow w-60 dark:bg-gray-700"
          >
            <ul
              id="citiesDropdown"
              class="h-48 py-2 overflow-y-auto text-gray-700 dark:text-gray-200"
              aria-labelledby="dropdownCitiesButton"
            ></ul>
            <!-- <a href="#" class="flex items-center p-3 text-sm font-medium text-blue-600 border-t border-gray-200 rounded-b-lg bg-gray-50 dark:border-gray-600 hover:bg-gray-100 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-blue-500 hover:underline">
        <svg class="w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 18">
          <path d="M6.5 9a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9ZM8 10H5a5.006 5.006 0 0 0-5 5v2a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-2a5.006 5.006 0 0 0-5-5Zm11-3h-2V5a1 1 0 0 0-2 0v2h-2a1 1 0 1 0 0 2h2v2a1 1 0 0 0 2 0V9h2a1 1 0 1 0 0-2Z"/>
        </svg>
        Recommend a new city
    </a> -->
          </div>

          <div class="flex items-center">
            <button
              id="sidebarToggle"
              class="toggle-btn flex items-center shadow bg-white rounded-lg p-3 m-1"
            >
              <i class="material-icons mx-1 sm:mx-2">menu</i>
              <span class="inline">Filter</span>
            </button>

            <button
              type="button"
              class="flex items-center bg-slate-600 text-white rounded-lg p-3 m-1"
              id="refresh-button"
            >
              <i class="material-icons mx-1 sm:mx-2">shuffle</i>
              <span class="inline">Generate Crawl</span>
            </button>
          </div>
        </div>

        <div id="collap-sidebar" class="z-0 bg-slate-200 hidden">
          <div class="flex flex-col md:flex-row pl-10 py-8 gap-10">
            <div>
              <label class="min-w-28 md:min-w-0" for="distance-slider"
                >Pubs:</label
              >
              <button
                class="btn-side rounded-full border-4 border-slate-300 marker-quantity-btn-minus btn-circle"
              >
                -
              </button>
              <span class="num-markers"></span>
              <button
                class="btn-side rounded-full border-4 border-slate-300 marker-quantity-btn-plus btn-circle"
              >
                +
              </button>
            </div>

            <div>
              <label class="min-w-28 md:min-w-4" for="distance-slider"
                >Attractions:</label
              >
              <button
                class="btn-side rounded-full border-4 border-slate-300 attraction-quantity-btn-minus btn-circle"
              >
                -
              </button>
              <span class="num-attractions"></span>
              <button
                class="btn-side rounded-full border-4 border-slate-300 attraction-quantity-btn-plus btn-circle"
              >
                +
              </button>
            </div>

            <div class="flex items-center justify-center">
              <span id="location-count-error" class="text-red-600 hidden"
                >You may select a maximum of 5 locations.</span
              >
            </div>
          </div>

          <div
            class="bg-slate-300 h-16 w-55 flex flex-row justify-center gap-4 rounded border-2 border-slate-200"
          >
            <button class="close-btn bg-slate-200 m-2 p-2 filter-reset">
              Reset Filters
            </button>
          </div>
        </div>

        <div
          id="secondaryBar"
          class="bg-slate-300 py-2 px-1 flex flex-col justify-between md:flex-row text-xs md:text-sm"
        >
          <div class="flex md:basis-2/5">
            <button
              id="shareButton"
              class="bg-slate-50 rounded-lg py-2 m-1 mb-2 shadow-sm inline-flex items-center justify-center basis-3/6"
              type="button"
            >
              <i class="material-icons mr-2">content_copy</i>Copy sharing link
            </button>

            <button
              id="googleMapsButton"
              class="bg-slate-50 rounded-lg py-2 m-1 mb-2 shadow-sm inline-flex items-center justify-center basis-3/6"
              type="button"
            >
              <i class="material-icons mr-2">map</i>Open in Google Maps
            </button>
          </div>

          <div class="flex flex-row p-1 m-1 items-center md:basis-1/2">
            <label
              id="start-location-text"
              class="md:ml-auto"
              for="distance-slider"
              >No starting location set
            </label>
            <div
              id="start-pill"
              class="bg-sky-600 ml-2 px-2 py-1 rounded-md text-white hidden"
            >
              <span id="pill-text">TT</span>
              <span class="pill-close" id="pill-close">✖</span>
            </div>
          </div>
        </div>

        <div id="map" class="relative flex flex-grow min-h-96">
          <datalist id="locations"></datalist>

          <div id="rightBar">
            <div class="bg-slate-100 flex flex-row" id="route-info">
              <div class="info-emblem flex items-center pl-1 pr-2">
                <i class="fas fa-info-circle"></i>
                <span class="tooltip-text"
                  >Pub crawl durations are calculated assuming you spend 30
                  minutes at each bar / attraction.</span
                >
              </div>
              <div>
                <p>
                  Route duration is
                  <span id="route-duration">50</span> minutes
                </p>
              </div>
            </div>
            <div
              class="overflow-x-auto max-w-screen-lg bg-slate-200 rounded-md p-1"
            >
              <div
                id="listing-group"
                class="flex flex-nowrap md:block md:max-w-[350px] listing-group sm:space-x-1 md:space-x-0"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="loading-overlay"></div>
    <div class="loading-spinner"></div>
  </body>
</html>
